get:
  tags:
    - Customer
  summary: List all customers
  operationId: listCustomers
  description: Retrieves a list of all customers in the system
  responses:
    '200':
      description: List of customers successfully retrieved
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/CustomerDto.yaml'
    '401':
      description: Unauthorized - Authentication token is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthorized"
    '403':
      description: Forbidden - Not enough permissions to access the resource
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Access denied"

post:
  tags:
    - Customer
  summary: Create a new customer
  operationId: createCustomer
  description: Creates a new customer with the provided details
  requestBody:
    description: Customer object to be created
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/CustomerDto.yaml'
  responses:
    '201':
      description: Customer successfully created
      content:
        application/json:
          schema:
            $ref: '../components/schemas/CustomerDto.yaml'
    '400':
      description: Invalid request body - validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Validation failed"
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: "name"
                    message:
                      type: string
                      example: "must not be blank"
