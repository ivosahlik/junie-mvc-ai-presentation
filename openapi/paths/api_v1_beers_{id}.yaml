parameters:
  - name: id
    in: path
    description: Unique identifier of the beer
    required: true
    schema:
      type: integer
      format: int32
      minimum: 1
      example: 42

get:
  tags:
    - Beer
  summary: Get beer by ID
  operationId: getBeerById
  description: Retrieves a specific beer by its unique identifier
  responses:
    '200':
      description: Beer successfully retrieved
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
    '404':
      description: Beer with the specified ID not found
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Beer not found"

put:
  tags:
    - Beer
  summary: Update an existing beer
  operationId: updateBeer
  description: Updates an existing beer with the provided details
  requestBody:
    description: Updated beer object
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerDto.yaml'
  responses:
    '200':
      description: Beer successfully updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
    '400':
      description: Invalid request body - validation errors
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Validation failed"
              errors:
                type: array
                items:
                  type: object
                  properties:
                    field:
                      type: string
                      example: "beerName"
                    message:
                      type: string
                      example: "must not be blank"
    '404':
      description: Beer with the specified ID not found

patch:
  tags:
    - Beer
  summary: Partially update a beer
  operationId: patchBeer
  description: Updates only the provided non-null fields of a beer
  requestBody:
    description: Beer patch object containing only the fields to update
    required: true
    content:
      application/json:
        schema:
          $ref: '../components/schemas/BeerPatchDto.yaml'
  responses:
    '200':
      description: Beer successfully updated
      content:
        application/json:
          schema:
            $ref: '../components/schemas/BeerDto.yaml'
    '404':
      description: Beer with the specified ID not found

delete:
  tags:
    - Beer
  summary: Delete a beer
  operationId: deleteBeer
  description: Deletes a beer with the specified ID
  responses:
    '204':
      description: Beer successfully deleted
    '404':
      description: Beer with the specified ID not found
