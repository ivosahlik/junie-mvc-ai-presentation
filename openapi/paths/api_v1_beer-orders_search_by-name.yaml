get:
  tags:
    - Beer Orders
  summary: Search beer orders by customer name
  operationId: searchBeerOrdersByCustomerName
  description: Search for beer orders by customer name (case-insensitive partial match)
  parameters:
    - name: customerName
      in: query
      description: Customer name to search for
      required: true
      schema:
        type: string
        example: "John"
  responses:
    '200':
      description: List of matching beer orders
      content:
        application/json:
          schema:
            type: array
            items:
              $ref: '../components/schemas/BeerOrderDto.yaml'
    '401':
      description: Unauthorized - Authentication token is missing or invalid
      content:
        application/json:
          schema:
            type: object
            properties:
              message:
                type: string
                example: "Unauthorized"
