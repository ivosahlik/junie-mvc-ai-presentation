type: object
description: Represents a customer in the system
required:
  - name
  - addressLine1
  - city
  - state
  - postalCode
properties:
  id:
    type: integer
    format: int32
    description: Unique identifier for the customer
    readOnly: true
    example: 123
  version:
    type: integer
    format: int32
    description: Version number for optimistic locking
    readOnly: true
    example: 1
  name:
    type: string
    description: Customer's full name
    example: "John Doe"
  email:
    type: string
    format: email
    description: Customer's email address
    example: "john.doe@example.com"
  phoneNumber:
    type: string
    description: Customer's phone number
    example: "+1-123-456-7890"
  addressLine1:
    type: string
    description: First line of customer's address
    example: "123 Main Street"
  addressLine2:
    type: string
    description: Second line of customer's address (optional)
    example: "Apt 4B"
  city:
    type: string
    description: City of customer's address
    example: "Boston"
  state:
    type: string
    description: State or province of customer's address
    example: "MA"
  postalCode:
    type: string
    description: Postal code of customer's address
    example: "02108"
  createdDate:
    type: string
    format: date-time
    description: Date and time when the customer was created
    readOnly: true
    example: "2025-10-09T14:30:00Z"
  updateDate:
    type: string
    format: date-time
    description: Date and time when the customer was last updated
    readOnly: true
    example: "2025-10-10T09:15:00Z"
