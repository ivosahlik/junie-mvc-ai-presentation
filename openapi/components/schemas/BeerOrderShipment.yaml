type: object
description: Represents a shipment for a beer order
required:
  - shipmentDate
properties:
  id:
    type: integer
    format: int32
    readOnly: true
    description: Unique identifier for the shipment
  version:
    type: integer
    format: int32
    readOnly: true
    description: Version number for optimistic locking
  createdDate:
    type: string
    format: date-time
    readOnly: true
    description: Date and time when the shipment was created
  updateDate:
    type: string
    format: date-time
    readOnly: true
    description: Date and time when the shipment was last updated
  shipmentDate:
    type: string
    format: date-time
    description: Date and time when the shipment was sent
  carrier:
    type: string
    description: Name of the shipping carrier (e.g., UPS, FedEx)
  trackingNumber:
    type: string
    description: Tracking number assigned by the carrier
  beerOrderId:
    type: integer
    format: int32
    readOnly: true
    description: ID of the associated beer order
