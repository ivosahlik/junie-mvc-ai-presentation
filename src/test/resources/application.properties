# H2 in-memory database configuration for tests
spring.datasource.url=jdbc:h2:mem:beerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate settings for testing
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
# Optional explicit dialect (Hibernate can infer this automatically)
# spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# H2 console (useful when running tests manually)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Disable Flyway for tests (no migrations provided)
spring.flyway.enabled=false
